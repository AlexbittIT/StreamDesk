# Конфигурация Spring Boot — аналог чтения .env в текущем бэкенде.
# Значения берутся из переменных окружения; в скобках — дефолт для локального запуска.

server:
  # Node убран — Java стал основным бэком. Порт по умолчанию 5050.
  port: ${SERVER_PORT:5050}
  servlet:
    session:
      # Срок жизни сессии — как maxAge куки в Express (7 дней).
      timeout: 7d
      cookie:
        # То же имя куки, что и в Express (streamdesk.sid) — чтобы фронт логинился без изменений.
        name: streamdesk.sid
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  servlet:
    multipart:
      # Держим лимит парсера чуть выше прикладного (20 МБ, docs/maps-api.md §4), чтобы
      # превышение размера ловил наш валидатор (MapPlanStorage → 413 с понятным сообщением),
      # а не сырой отказ Tomcat. Слишком большие файлы всё равно отсекает GlobalExceptionHandler.
      max-file-size: 25MB
      max-request-size: 25MB

  datasource:
    # Та же база, что и у TS-бэкенда. JDBC-формат отличается от postgresql://...,
    # поэтому задаём JDBC_DATABASE_URL отдельно, например:
    #   jdbc:postgresql://localhost:5432/streamdesk
    url: ${SPRING_DATASOURCE_URL:${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/streamdesk}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # По умолчанию validate/none — Hibernate НЕ меняет уже существующую схему.
      # Управляется переменной SPRING_JPA_HIBERNATE_DDL_AUTO: для локального dev/compose
      # можно задать update (Hibernate сам создаст таблицы из сущностей на свежей БД).
      # На рабочей БД оставляй validate и применяй SQL-миграции вручную.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Даты отдаём в ISO-формате (как JSON у Express), а не числом-таймстампом.
  jackson:
    serialization:
      write-dates-as-timestamps: false

  # SMTP для дублирования уведомлений почтой (email-нотификации админам компании и т.п.).
  # Без MAIL_HOST письма не уходят: EmailService best-effort — ошибку только логирует.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Источники, которым разрешён доступ с куками (dev-сервер фронта и текущий бэкенд).
# Переопределяется переменной CORS_ALLOWED_ORIGINS (через запятую).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5000,http://localhost:3000}
  # Публичный адрес фронтенда — для абсолютных ссылок в письмах (например, на проблемную зону).
  frontend-url: ${FRONTEND_URL:}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@streamdesk.local}}
  # Fallback-админ для теста — ВКЛЮЧЁН по умолчанию (staging).
  # На проде переопредели через ALLOW_FALLBACK_ADMIN=false.
  auth:
    fallback-admin-enabled: ${ALLOW_FALLBACK_ADMIN:true}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
  # AI-генерация схем подключения (DeepSeek). Без ключа эндпоинт /ai-schema
  # отвечает явной ошибкой 503 (фолбэка на шаблон нет).
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${DEEPSEEK_MODEL:deepseek-chat}
      # openai — стандартный DeepSeek; anthropic — шлюз OpenModel (/messages)
      protocol: ${DEEPSEEK_PROTOCOL:openai}
      max-attempts: ${DEEPSEEK_MAX_ATTEMPTS:3}
  # MediaMTX — внешний медиасервер (SRT/RTMP → HLS). Бэкенд управляет путями
  # через его Control API и строит URL публикации/чтения. Без запущенного
  # MediaMTX эндпоинты /api/mediamtx отвечают 503; /health вернёт reachable=false.
  mediamtx:
    api-url: ${MEDIAMTX_API_URL:http://localhost:9997}
    host: ${MEDIAMTX_HOST:localhost}
    srt-port: ${MEDIAMTX_SRT_PORT:8890}
    rtmp-port: ${MEDIAMTX_RTMP_PORT:1935}
    hls-port: ${MEDIAMTX_HLS_PORT:8888}
    webrtc-port: ${MEDIAMTX_WEBRTC_PORT:8889}
    rtsp-port: ${MEDIAMTX_RTSP_PORT:8554}
    hls-scheme: ${MEDIAMTX_HLS_SCHEME:http}

logging:
  level:
    org.springframework.security: INFO
    com.streamdesk: DEBUG
