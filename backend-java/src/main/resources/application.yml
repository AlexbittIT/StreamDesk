# Конфигурация Spring Boot — аналог чтения .env в текущем бэкенде.
# Значения берутся из переменных окружения; в скобках — дефолт для локального запуска.

server:
  # У текущего бэкенда порт 5000 (PORT в .env). Чтобы запускать оба рядом,
  # Java-версию временно держим на 8080. Поменяй на 5000, когда переедешь полностью.
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # Срок жизни сессии — как maxAge куки в Express (7 дней).
      timeout: 7d
      cookie:
        # То же имя куки, что и в Express (streamdesk.sid) — чтобы фронт логинился без изменений.
        name: streamdesk.sid
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  datasource:
    # Та же база, что и у TS-бэкенда. JDBC-формат отличается от postgresql://...,
    # поэтому задаём JDBC_DATABASE_URL отдельно, например:
    #   jdbc:postgresql://localhost:5432/streamdesk
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/streamdesk}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # ВАЖНО: validate/none, чтобы Hibernate НЕ менял уже существующую схему,
      # созданную Drizzle. Никогда не ставь здесь create/update на рабочей БД.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # Даты отдаём в ISO-формате (как JSON у Express), а не числом-таймстампом.
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Источники, которым разрешён доступ с куками (dev-сервер фронта и текущий бэкенд).
# Переопределяется переменной CORS_ALLOWED_ORIGINS (через запятую).
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5000,http://localhost:3000}
  # Fallback-админ для теста — как ALLOW_FALLBACK_ADMIN/ADMIN_* в Express.
  auth:
    fallback-admin-enabled: ${ALLOW_FALLBACK_ADMIN:true}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    org.springframework.security: INFO
    com.streamdesk: DEBUG