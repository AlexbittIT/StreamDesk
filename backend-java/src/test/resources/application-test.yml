# Профиль "test" — поднимает полный Spring-контекст на in-memory H2 вместо Postgres,
# чтобы E2E-тесты гоняли реальную логику (контроллеры → сервисы → JPA) без внешней БД.
#
# Сущности используют columnDefinition = "jsonb" (Postgres). H2 такого типа не знает,
# поэтому в INIT создаём ДОМЕН JSONB поверх встроенного JSON — DDL Hibernate проходит,
# а значения сериализуются стандартным JSON-биндингом Hibernate (@JdbcTypeCode JSON).
#
# Профиль-специфичный yml МЕРЖИТСЯ с основным application.yml: общий конфиг (CORS,
# auth-fallback и т.п.) остаётся, переопределяем только datasource/jpa и гасим AI-ключ.

spring:
  datasource:
    url: jdbc:h2:mem:streamdesk_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # На пустой H2 Hibernate сам создаёт таблицы из сущностей и сносит их после прогона.
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

# AI-генерация в тестах идёт через мок DeepSeekClient — реальный ключ не нужен.
app:
  ai:
    deepseek:
      api-key: ""
