services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Проброс на хост для доступа GUI-клиентами (DBeaver/IntelliJ/pgAdmin).
      # Если 5432 на хосте занят — поменяй левую часть на 5433.
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Старый дамп БД: выполняется автоматически ТОЛЬКО при первом старте (пустой pgdata).
      # Чтобы перезалить — нужно пересоздать volume: docker compose down -v && docker compose up -d
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-streamdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # JDBC к БД внутри docker-сети (хост = имя сервиса "db")
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-streamdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Java-only: Hibernate сам создаёт/обновляет схему из сущностей (Drizzle/Node не нужны)
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Staging: fallback-админ admin/admin123 включён по умолчанию, чтобы можно было войти
      # на свежей БД (на проде переопредели ALLOW_FALLBACK_ADMIN=false).
      ALLOW_FALLBACK_ADMIN: "${ALLOW_FALLBACK_ADMIN:-true}"
      SERVER_PORT: "5050"
      # AI для схем подключения и подбора портов (DeepSeek / HuggingFace).
      # Без ключей стек поднимется, но AI-эндпоинты вернут 503 — задай в .env при необходимости.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      # Базовый URL и протокол шлюза (для OpenModel: base-url .../v1, protocol anthropic)
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_PROTOCOL: "${DEEPSEEK_PROTOCOL:-openai}"
      HUGGINGFACE_API_KEY: "${HUGGINGFACE_API_KEY:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
    ports:
      - "5050:5050"
    # Готовность приложения видна в `docker compose ps` (HEALTHCHECK из Dockerfile
    # опрашивает /api/health). Здесь переопределяем тайминги под staging.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5050/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 80s
    volumes:
      # Загруженные файлы (фото/аватары/чат/транскрипции) — переживают пересоздание контейнера
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
