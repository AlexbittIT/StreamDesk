services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Проброс ТОЛЬКО на localhost хоста — для GUI-клиентов (DBeaver/IntelliJ/pgAdmin)
      # через SSH-туннель. Наружу порт БД не публикуется. Если 5432 занят — поменяй
      # левую часть на 127.0.0.1:5433.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-streamdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Старый дамп БД: выполняется автоматически ТОЛЬКО при первом старте (пустой pgdata).
      # Чтобы перезалить — нужно пересоздать volume: docker compose down -v && docker compose up -d
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-streamdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # JDBC к БД внутри docker-сети (хост = имя сервиса "db")
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-streamdesk}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Схема БД: по умолчанию validate (Hibernate НЕ трогает существующую схему).
      # На свежей пустой БД задай один раз SPRING_JPA_HIBERNATE_DDL_AUTO=update в .env,
      # чтобы Hibernate создал таблицы, затем убери переменную (вернётся validate).
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}"
      # Безопасный дефолт: fallback-админ admin/admin123 ВЫКЛЮЧЕН. Для входа на свежую БД
      # временно задай ALLOW_FALLBACK_ADMIN=true в .env (staging), на проде не включай.
      ALLOW_FALLBACK_ADMIN: "${ALLOW_FALLBACK_ADMIN:-false}"
      # Secure-флаг session-куки: true только за HTTPS (иначе браузер её не сохранит по HTTP).
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      # Домены, которым разрешены запросы с куками (через запятую). На проде — свой домен.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5000,http://localhost:3000}"
      SERVER_PORT: "5050"
      # AI для схем подключения и подбора портов (DeepSeek / HuggingFace).
      # Без ключей стек поднимется, но AI-эндпоинты вернут 503 — задай в .env при необходимости.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      # Базовый URL и протокол шлюза (для OpenModel: base-url .../v1, protocol anthropic)
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_PROTOCOL: "${DEEPSEEK_PROTOCOL:-openai}"
      HUGGINGFACE_API_KEY: "${HUGGINGFACE_API_KEY:-}"
      HF_TOKEN: "${HF_TOKEN:-}"
      # MediaMTX (внешний медиасервер). Бэкенд управляет им через Control API (порт 9997)
      # и строит URL потоков. Укажи адрес своего MediaMTX; без него /api/mediamtx вернёт 503.
      # host.docker.internal — это хост, где запущен MediaMTX, со стороны контейнера.
      MEDIAMTX_API_URL: "${MEDIAMTX_API_URL:-http://host.docker.internal:9997}"
      MEDIAMTX_HOST: "${MEDIAMTX_HOST:-localhost}"
      MEDIAMTX_SRT_PORT: "${MEDIAMTX_SRT_PORT:-8890}"
      MEDIAMTX_RTMP_PORT: "${MEDIAMTX_RTMP_PORT:-1935}"
      MEDIAMTX_HLS_PORT: "${MEDIAMTX_HLS_PORT:-8888}"
      MEDIAMTX_WEBRTC_PORT: "${MEDIAMTX_WEBRTC_PORT:-8889}"
      MEDIAMTX_RTSP_PORT: "${MEDIAMTX_RTSP_PORT:-8554}"
      MEDIAMTX_HLS_SCHEME: "${MEDIAMTX_HLS_SCHEME:-http}"
    ports:
      # Наружу приложение НЕ публикуем — HTTPS-трафик идёт через caddy (443).
      # На хосте порт открыт только на localhost (для отладки/health с самого сервера).
      # Caddy достаёт приложение по внутренней docker-сети как app:5050.
      - "127.0.0.1:5050:5050"
    # Готовность приложения видна в `docker compose ps` (HEALTHCHECK из Dockerfile
    # опрашивает /api/health). Здесь переопределяем тайминги под staging.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5050/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 80s
    volumes:
      # Загруженные файлы (фото/аватары/чат/транскрипции) — переживают пересоздание контейнера
      - uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # 80 нужен для ACME-проверки Let's Encrypt и редиректа на HTTPS; 443 — сам сайт.
      - "80:80"
      - "443:443"
    environment:
      # Домен сайта. Реальный (app.example.ru) -> авто-сертификат Let's Encrypt.
      # localhost (по умолчанию) -> self-signed внутренний CA (для локали).
      SITE_DOMAIN: "${SITE_DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификаты и ACME-аккаунт — переживают пересоздание контейнера
      # (иначе Let's Encrypt упрётся в rate-limit при частых рестартах).
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
