name: CI

# Сборка и тесты бэкенда (Java) и фронтенда (React) на каждый push/PR в main/develop.
# Падение любого теста роняет job → PR с красными тестами нельзя смержить,
# если в Settings → Branches включить Required status checks на этот workflow.
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-verify:
    name: backend-java • mvn verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, test & coverage (mvn verify)
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-backend
          path: backend-java/target/site/jacoco
          if-no-files-found: warn

  frontend-verify:
    name: frontend • test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests + coverage (vitest)
        run: npm run test:coverage

      - name: Production build (vite)
        run: npm run build

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend
          if-no-files-found: warn
